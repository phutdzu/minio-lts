# CI for the MinIO LTS repository: checks only, nothing is built or published.
#
# Runs on every pull request, every push to main and weekly (the weekly run
# catches newly published CVEs through govulncheck).
#
# Releases are a separate workflow, see release.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  # Everything builds offline from the vendored sources.
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local

jobs:
  # go.mod, go.sum and vendor/ must be in sync, and nothing in vendor/ may be
  # hidden by .gitignore.
  vendor-check:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: ""
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go mod tidy -e
          go mod vendor
          if [ -n "$(git status --porcelain --ignored go.mod go.sum vendor)" ]; then
            git status --short --ignored go.mod go.sum vendor | head -20
            echo "go.mod/go.sum/vendor are out of sync, run 'go mod tidy -e && go mod vendor' and commit"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags kqueue --timeout=20m --config ./.golangci.yml

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
      MINIO_API_REQUESTS_MAX: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -tags kqueue,dev -timeout 40m ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          GOFLAGS= GOPROXY=https://proxy.golang.org,direct go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint helm/minio
