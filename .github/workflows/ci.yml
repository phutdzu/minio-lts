# GitHub Actions for the MinIO community fork.
#
# - pull requests / push to main / weekly schedule: checks only (vendor-check,
#   lint, unit-test, govulncheck, helm-lint). Nothing is built or published.
# - release: builds and publishes. Multi-arch images to GHCR, binaries and
#   SHA256SUMS in a GitHub release. The checks do not run again, release a
#   commit that is already green on main. Two ways to start one:
#     * Actions > CI > Run workflow > branch main, tick "release". The tag
#       FORK.<UTC commit time> is created by the workflow after the build.
#     * push a tag by hand:  git tag "$(make -s version)" && git push origin --tags

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["FORK.*"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release from main (the tag FORK.<commit time> is created automatically)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A release must never be cancelled by a later push.
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

env:
  GO_VERSION: "1.26"
  # Everything builds offline from the vendored sources.
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOTOOLCHAIN: local

jobs:
  # go.mod, go.sum and vendor/ must be in sync, and nothing in vendor/ may be
  # hidden by .gitignore.
  vendor-check:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    runs-on: ubuntu-latest
    env:
      GOFLAGS: ""
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go mod tidy -e
          go mod vendor
          if [ -n "$(git status --porcelain --ignored go.mod go.sum vendor)" ]; then
            git status --short --ignored go.mod go.sum vendor | head -20
            echo "go.mod/go.sum/vendor are out of sync, run 'go mod tidy -e && go mod vendor' and commit"
            exit 1
          fi

  # Decides whether this run is a release and which tag it publishes. The tag
  # is FORK.<UTC commit time> so that the version baked into the binary equals
  # the tag.
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          tag="FORK.$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H-%M-%SZ)"
          release=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=true
            test "${GITHUB_REF_NAME}" = "${tag}" || { echo "tag ${GITHUB_REF_NAME} must be ${tag}"; exit 1; }
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_RELEASE}" = "true" ]; then
            release=true
            test "${GITHUB_REF}" = "refs/heads/main" || { echo "releases are cut from main only"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "release ${tag} already exists, there is no new commit to release"
              exit 1
            fi
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  lint:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags kqueue --timeout=20m --config ./.golangci.yml

  unit-test:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
      MINIO_API_REQUESTS_MAX: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -tags kqueue,dev -timeout 40m ./...

  govulncheck:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          GOFLAGS= GOPROXY=https://proxy.golang.org,direct go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  helm-lint:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint helm/minio

  # Cross compiles every supported platform, the release job publishes them.
  binaries:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: bash buildscripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Builds and pushes the server image (ghcr.io/<owner>/<repo>-server) and the
  # mc client image (ghcr.io/<owner>/<repo>-client), tagged with the release tag
  # and `latest`.
  image:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          COMMIT_ID="$(git rev-parse HEAD)"
          COMMIT_TIME="$(git log -1 --format=%cI)"
          build() { # build <target> <image>
            docker buildx build \
              --target "$1" \
              --platform linux/amd64,linux/arm64 \
              --build-arg COMMIT_ID="${COMMIT_ID}" \
              --build-arg COMMIT_TIME="${COMMIT_TIME}" \
              -t "$2:${RELEASE_TAG}" -t "$2:latest" \
              --push .
          }
          build minio "${IMAGE}-server"
          build mc "${IMAGE}-client"

  release:
    needs: [plan, binaries, image]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<NOTES
          Unofficial MinIO community fork, version \`${RELEASE_TAG}\`.

          Container images (linux/amd64, linux/arm64): \`${IMAGE}-server:${RELEASE_TAG}\` and the client \`${IMAGE}-client:${RELEASE_TAG}\`

          Verify downloads with \`SHA256SUMS\`. Licensed under AGPLv3, source is this repository at the tagged commit.
          NOTES
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file notes.md
